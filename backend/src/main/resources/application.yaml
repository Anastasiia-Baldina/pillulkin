spring:
  application:
    name: pillulkin

  datasource:
    url: jdbc:postgresql://localhost:5432/pillulkin?options=-c%20client_encoding=UTF8
    username: pillulkin
    password: pillulkin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

google:
  client:
    id: ${GOOGLE_CLIENT_ID:796860851053-ajbge1rt3hehhov8t2vi6o66ucrc1osg.apps.googleusercontent.com}

logging:
  level:
    com.example.pillulkin: DEBUG
    org.springframework.security: DEBUG