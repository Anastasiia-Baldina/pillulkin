version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pillulkin-db
    environment:
      POSTGRES_DB: pillulkin
      POSTGRES_USER: pillulkin
      POSTGRES_PASSWORD: pillulkin
      LANG: en_US.utf8
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pillulkin"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pillulkin-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pillulkin?options=-c%20client_encoding=UTF8
      SPRING_DATASOURCE_USERNAME: pillulkin
      SPRING_DATASOURCE_PASSWORD: pillulkin
      ML_SERVICE_URL: http://ml-service:8001
    depends_on:
      postgres:
        condition: service_healthy

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: pillulkin-ml
    ports:
      - "8001:8001"

volumes:
  postgres_data:
